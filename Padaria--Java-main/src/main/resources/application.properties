spring.application.name=cadastro-usuario

# Console do H2 (desative em produção com H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:usuario
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
#spring.jpa.show-sql=true

# Usuário administrador criado ao iniciar (troque a senha em produção com ADMIN_SENHA)
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.senha=${ADMIN_SENHA:admin123}

# Origens liberadas no CORS quando o front é aberto fora do Spring (ex: IntelliJ)
app.cors.origens=${CORS_ORIGENS:http://localhost:63342,http://localhost:5500,http://127.0.0.1:5500}

server.port=${PORT:8080}
